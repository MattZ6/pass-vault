name: Create Production Builds and Submit

on:
  push:
    branches: ["prod"]

jobs:
  build_android:
    name: Build Android App
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play Store
    needs: [build_android]
    type: submit
    env:
      EXPO_DEBUG: "1"
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
