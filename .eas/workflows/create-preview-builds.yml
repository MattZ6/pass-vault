name: Create Preview Builds

on:
  push:
    branches: ["staging"]

jobs:
  checks:
    name: Checks
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Type check
        run: bun typecheck
      - name: Lint
        run: bun lint:ci
      - name: Test
        run: bun test

  build_android:
    name: Build Android App
    needs: [checks]
    type: build
    params:
      platform: android
      profile: preview
